<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Checklist — Randomthing.org</title>
<meta name="description" content="A checklist for today. Give an item a deadline, and when tomorrow comes the list starts empty with yesterday's filed into the archive." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --ui:"Inter",system-ui,-apple-system,sans-serif; --ink:#1b1b20; --muted:#8a8a93; --line:#e8e8ec;
    --accent:#22a06b; --late:#e5484d; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body { font-family:var(--ui); color:var(--ink); background:#f6f7f6; min-height:100vh;
    -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none; }

  .nav { display:flex; align-items:center; gap:12px; padding:14px 20px; padding-left:max(20px, env(safe-area-inset-left)); }
  .brand { font-family:"Baloo 2",sans-serif; font-weight:800; font-size:20px; letter-spacing:-.4px; color:var(--ink); text-decoration:none; padding:5px 8px; border-radius:10px; }
  .brand:hover { background:rgba(0,0,0,.05); }
  .brand .org { color:#ff5a5f; }
  .nav .sep { color:#cfcfd4; } .nav h1 { font-size:15px; font-weight:600; margin:0; color:#56565e; }

  .wrap { max-width:520px; margin:0 auto; padding:6px 18px 70px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:20px; box-shadow:0 12px 30px rgba(30,40,30,.06); overflow:hidden; }

  /* today's date strip */
  .today { display:flex; align-items:center; gap:9px; padding:15px 17px 13px; border-bottom:1px solid var(--line); }
  .today-date { font:800 16px "Baloo 2",var(--ui); letter-spacing:-.2px; }
  .tag { font-size:11px; font-weight:700; color:var(--accent); background:rgba(34,160,107,.1); padding:3px 8px; border-radius:99px; white-space:nowrap; }
  .tag.late { color:var(--late); background:rgba(229,72,77,.1); }

  .add { display:flex; gap:8px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .add input.txt-in { flex:1 1 auto; min-width:0; border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font:600 15px var(--ui); color:var(--ink); outline:none; -webkit-user-select:text; user-select:text; transition:border-color .12s; }
  .add input.txt-in:focus { border-color:var(--accent); }
  .add button.go { flex:0 0 auto; border:none; border-radius:12px; padding:0 17px; cursor:pointer;
    font:800 15px "Baloo 2",var(--ui); background:var(--accent); color:#fff; transition:filter .14s, transform .06s; }
  .add button.go:hover { filter:brightness(1.07); } .add button.go:active { transform:translateY(1px); }

  /* deadline chip — a transparent <input type=time> sits over it and opens the native picker */
  .due { position:relative; flex:0 0 auto; display:flex; align-items:center; gap:5px; height:26px; padding:0 9px;
    border-radius:99px; background:#f1f1f4; color:#a6a6b0; white-space:nowrap;
    font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; transition:opacity .12s, color .12s, background .12s; }
  .due svg { width:12px; height:12px; }
  .due span { line-height:1; }
  .due.set  { color:var(--accent); background:rgba(34,160,107,.12); }
  .due.over { color:var(--late);   background:rgba(229,72,77,.12); }
  .due.unset { opacity:0; }
  li:hover .due.unset, li:focus-within .due.unset { opacity:1; }
  .due input { position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; border:none;
    opacity:0; cursor:pointer; background:none; color:transparent; }
  .due:hover { background:#e9e9ee; }
  .due.set:hover  { background:rgba(34,160,107,.2); }
  .due.over:hover { background:rgba(229,72,77,.2); }
  .add .due { height:44px; padding:0 12px; font-size:13px; }
  .add .due svg { width:14px; height:14px; }
  .add .due.unset { opacity:1; }          /* the add row's clock is the affordance — always shown */

  ul.list { list-style:none; margin:0; padding:0; }
  ul.list li { display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid #f1f1f3; }
  ul.list li:last-child { border-bottom:none; }
  .box { flex:0 0 auto; width:22px; height:22px; border-radius:7px; border:2px solid #d6d6dc; background:#fff;
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color .12s, background .12s; }
  .box:hover { border-color:var(--accent); }
  .box svg { width:13px; height:13px; opacity:0; transform:scale(.6); transition:opacity .12s, transform .12s; color:#fff; }
  li.done .box { background:var(--accent); border-color:var(--accent); }
  li.done .box svg { opacity:1; transform:scale(1); }
  .txt { flex:1 1 auto; min-width:0; font-size:15px; font-weight:500; line-height:1.4; word-break:break-word;
    cursor:pointer; transition:color .12s; }
  li.done .txt { color:#b3b3bb; text-decoration:line-through; }
  li.done .due { opacity:.5; }
  .del { flex:0 0 auto; border:none; background:none; cursor:pointer; color:#c9c9d0; padding:5px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .12s, color .12s, background .12s; }
  .del svg { width:15px; height:15px; }
  li:hover .del, li:focus-within .del { opacity:1; }
  .del:hover { color:var(--late); background:rgba(229,72,77,.1); }

  .empty { padding:32px 20px; text-align:center; color:var(--muted); font-size:14px; font-weight:500; line-height:1.6; }

  .foot { display:flex; align-items:center; gap:8px; padding:11px 12px 11px 16px;
    border-top:1px solid var(--line); background:#fbfbfb; }
  .count { flex:1 1 auto; font-size:13px; font-weight:600; color:var(--muted); }
  .count .late-n { color:var(--late); }
  .fbtn { flex:0 0 auto; border:none; background:none; cursor:pointer; font:600 13px var(--ui); color:var(--muted);
    padding:6px 10px; border-radius:9px; display:flex; align-items:center; gap:6px; transition:color .12s, background .12s; }
  .fbtn:hover { color:var(--ink); background:#f0f0f2; }
  .fbtn.danger:hover { color:var(--late); background:rgba(229,72,77,.08); }
  .fbtn.hide { display:none; }
  .badge { font-size:11px; font-weight:800; background:#e6e6ea; color:#6f6f79; border-radius:99px; padding:1px 6px; }
  .fbtn:hover .badge { background:#dcdce2; }
  .badge.hide { display:none; }

  /* archive popup */
  .overlay { position:fixed; inset:0; z-index:60; background:rgba(20,28,22,.42);
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .overlay.hide { display:none; }
  .modal { background:#fff; border-radius:20px; width:100%; max-width:440px; max-height:min(78vh, 640px);
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.28); }
  .modal-top { display:flex; align-items:center; gap:10px; padding:15px 12px 15px 18px; border-bottom:1px solid var(--line); }
  .modal-top h2 { margin:0; font:800 18px "Baloo 2",var(--ui); flex:1 1 auto; }
  .x { flex:0 0 auto; border:none; background:none; cursor:pointer; color:#a0a0aa; padding:7px; border-radius:9px; display:flex; }
  .x svg { width:16px; height:16px; }
  .x:hover { background:#f1f1f3; color:var(--ink); }
  .modal-body { overflow-y:auto; -webkit-overflow-scrolling:touch; }

  .day { border-bottom:1px solid #f1f1f3; }
  .day:last-child { border-bottom:none; }
  .day-top { display:flex; align-items:center; gap:8px; padding:12px 12px 12px 16px; cursor:pointer; }
  .day-top:hover { background:#fafafa; }
  .caret { flex:0 0 auto; color:#b8b8c0; display:flex; transition:transform .16s; }
  .caret svg { width:13px; height:13px; }
  .day.open .caret { transform:rotate(90deg); }
  .day-date { font-size:14px; font-weight:700; white-space:nowrap; }
  .day-count { flex:1 1 auto; text-align:right; font-size:12px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }
  .day-del { flex:0 0 auto; border:none; background:none; cursor:pointer; color:#cdcdd4; padding:5px; border-radius:8px; display:flex; }
  .day-del svg { width:14px; height:14px; }
  .day-del:hover { color:var(--late); background:rgba(229,72,77,.1); }
  ul.day-items { list-style:none; margin:0; padding:0 16px 12px 37px; display:none; }
  .day.open ul.day-items { display:block; }
  ul.day-items li { display:flex; align-items:flex-start; gap:9px; padding:5px 0; font-size:14px; font-weight:500; line-height:1.45; }
  .mini-box { flex:0 0 auto; margin-top:2px; width:16px; height:16px; border-radius:5px; border:2px solid #d8d8de;
    display:flex; align-items:center; justify-content:center; }
  .mini-box svg { width:9px; height:9px; color:#fff; opacity:0; }
  ul.day-items li.d .mini-box { background:var(--accent); border-color:var(--accent); }
  ul.day-items li.d .mini-box svg { opacity:1; }
  ul.day-items li.d .a-txt { color:#b3b3bb; text-decoration:line-through; }
  .a-txt { flex:1 1 auto; min-width:0; word-break:break-word; }
  .a-due { flex:0 0 auto; margin-top:1px; display:flex; align-items:center; gap:4px; padding:1px 7px; border-radius:99px;
    font-size:11px; font-weight:700; color:#a6a6b0; background:#f1f1f4; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .a-due svg { width:10px; height:10px; }
  ul.day-items li.miss .a-due { color:var(--late); background:rgba(229,72,77,.12); }

  .modal-foot { padding:11px 14px; border-top:1px solid var(--line); background:#fbfbfb; display:flex; justify-content:flex-end; }
  .confirm { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; width:100%; }
  .confirm.hide { display:none; }
  .warn { flex:1 1 170px; font-size:12.5px; font-weight:600; color:var(--late); line-height:1.45; }
  .fbtn.solid { background:var(--late); color:#fff; }
  .fbtn.solid:hover { background:#cf3b40; color:#fff; }
  .arch-empty { padding:38px 24px; text-align:center; color:var(--muted); font-size:14px; font-weight:500; line-height:1.65; }

  /* the footer runs out of room before the rest of the card does */
  @media (max-width:460px){
    .foot { flex-wrap:wrap; justify-content:flex-end; }
    .count { flex:1 0 100%; }
  }

  @media (max-width:380px){
    .add { padding:12px 13px; gap:7px; } ul.list li { padding:12px 13px; gap:9px; }
    .del { opacity:1; } .due.unset { opacity:1; }
    .add .due { padding:0 10px; }
    .today { padding:13px 15px 11px; } .today-date { font-size:15px; }
    .foot { padding-left:13px; } .fbtn { padding:6px 8px; }
    .overlay { padding:12px; } ul.day-items { padding-left:34px; }
  }
</style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">Randomthing<span class="org">.org</span></a>
    <span class="sep">/</span><h1>Checklist</h1>
  </nav>

  <div class="wrap">
    <div class="card">
      <div class="today">
        <span class="today-date" id="todayDate"></span>
        <span class="tag">Today</span>
      </div>

      <form class="add" id="addForm" autocomplete="off">
        <input class="txt-in" id="addInput" type="text" maxlength="200" placeholder="Add an item…" aria-label="Add an item" />
        <span class="due unset" id="addDue" title="Deadline"></span>
        <button class="go" type="submit" id="addBtn">Add</button>
      </form>

      <ul class="list" id="list"></ul>
      <div class="empty" id="empty">Nothing here yet — add your first item above.<br />Give an item a deadline with the clock, and tomorrow this list starts fresh.</div>

      <div class="foot">
        <span class="count" id="count"></span>
        <button class="fbtn hide" id="stashBtn" type="button">Put away</button>
        <button class="fbtn" id="archBtn" type="button"><span>Archive</span><span class="badge hide" id="archCount">0</span></button>
      </div>
    </div>
  </div>

  <div class="overlay hide" id="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Archive">
      <div class="modal-top">
        <h2>Archive</h2>
        <button class="x" id="closeArch" type="button" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="archBody"></div>
      <div class="modal-foot">
        <button class="fbtn danger hide" id="wipeArch" type="button">Clear archive</button>
        <div class="confirm hide" id="wipeAsk">
          <span class="warn">This empties the whole archive — every past day. It can’t be undone.</span>
          <button class="fbtn" id="wipeNo" type="button">Cancel</button>
          <button class="fbtn solid" id="wipeYes" type="button">Empty it</button>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const K_ITEMS = 'checklist_items', K_DAY = 'checklist_day', K_ARCH = 'checklist_archive';
  const MAX_DAYS = 90;
  const TICK  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const EX    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const CARET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg>';
  const CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>';

  // ---------- dates & times ----------
  function ymd(d){
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function hm(d){ return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function isKo(){ try { return localStorage.getItem('rt_lang') === 'ko'; } catch(e){ return false; } }
  function pretty(iso){
    const p = iso.split('-').map(Number);
    const d = new Date(p[0], p[1] - 1, p[2]);
    if (isNaN(d)) return iso;
    return isKo()
      ? d.toLocaleDateString('ko-KR', { month:'long', day:'numeric', weekday:'long' })
      : d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
  }
  function prettyTime(v){
    const p = v.split(':').map(Number);
    const d = new Date(); d.setHours(p[0], p[1], 0, 0);
    return d.toLocaleTimeString(isKo() ? 'ko-KR' : 'en-US', { hour:'numeric', minute:'2-digit' });
  }
  // The counts are written here rather than left to the shared translator: they
  // are rebuilt on every keystroke, and a half-translated tally reads badly.
  function doneText(done, total){
    return isKo() ? (total + '개 중 ' + done + '개 완료') : (done + ' of ' + total + ' done');
  }
  function lateText(n){ return isKo() ? (n + '개 마감 지남') : (n + ' overdue'); }

  function daysAgo(iso){
    const p = iso.split('-').map(Number);
    const a = new Date(p[0], p[1] - 1, p[2]), b = new Date();
    a.setHours(0,0,0,0); b.setHours(0,0,0,0);
    return Math.round((b - a) / 86400000);
  }
  // Only today's unfinished items can run late; a day already archived is settled.
  function isLate(it){ return !!it.due && !it.done && day === ymd(new Date()) && it.due < hm(new Date()); }

  // ---------- storage ----------
  function cleanItems(raw){
    if (!Array.isArray(raw)) return [];
    return raw.filter(o => o && typeof o.text === 'string').map(o => ({
      text: o.text.slice(0, 200),
      done: !!o.done,
      due: (typeof o.due === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(o.due)) ? o.due : null
    }));
  }
  function readJSON(key){ try { return JSON.parse(localStorage.getItem(key)); } catch(e){ return null; } }

  let items = cleanItems(readJSON(K_ITEMS));
  let archive = (function(){
    const raw = readJSON(K_ARCH);
    if (!Array.isArray(raw)) return [];
    return raw.filter(e => e && typeof e.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e.date))
              .map(e => ({ date: e.date, items: cleanItems(e.items) }))
              .filter(e => e.items.length)
              .sort((a, b) => b.date.localeCompare(a.date));
  })();
  let day = null;
  try { day = localStorage.getItem(K_DAY); } catch(e){}
  if (!day || !/^\d{4}-\d{2}-\d{2}$/.test(day)) day = ymd(new Date());   // first visit, or a list from before days existed

  function saveToday(){
    try { localStorage.setItem(K_ITEMS, JSON.stringify(items)); localStorage.setItem(K_DAY, day); } catch(e){}
  }
  function saveArchive(){ try { localStorage.setItem(K_ARCH, JSON.stringify(archive)); } catch(e){} }

  // Items reach the archive two ways — ticked off and put away by hand, or left
  // on the list when the day turns — so both go through here and a day filed
  // twice keeps everything.
  function fileInto(date, list){
    if (!list.length) return;
    const entry = archive.find(e => e.date === date);
    if (entry) entry.items = entry.items.concat(list);
    else archive.push({ date: date, items: list.slice() });
    archive.sort((a, b) => b.date.localeCompare(a.date));
    if (archive.length > MAX_DAYS) archive.length = MAX_DAYS;
    saveArchive();
  }

  // File whatever is left away and start the new day empty. Runs on load and
  // while the page sits open past midnight.
  function rollover(){
    const today = ymd(new Date());
    if (day === today) return false;
    fileInto(day, items);
    day = today; items = [];
    saveToday();
    return true;
  }

  // ---------- the deadline chip ----------
  // A styled pill with a transparent <input type="time"> laid over it, so a tap
  // gets the browser's own picker on every platform.
  function makeDue(value, onPick){
    const chip = document.createElement('span');
    chip.className = 'due unset';
    chip.title = 'Deadline';

    const icon = document.createElement('span');
    icon.style.display = 'flex'; icon.innerHTML = CLOCK;
    const label = document.createElement('span');

    const input = document.createElement('input');
    input.type = 'time'; input.setAttribute('aria-label', 'Deadline');
    input.value = value || '';

    chip.appendChild(icon); chip.appendChild(label); chip.appendChild(input);
    chip.paint = function (v, late){
      label.textContent = v ? prettyTime(v) : '';
      input.value = v || '';
      chip.classList.toggle('unset', !v);
      chip.classList.toggle('set', !!v && !late);
      chip.classList.toggle('over', !!v && !!late);
    };
    chip.paint(value, false);

    input.addEventListener('change', () => onPick(input.value || null));
    input.addEventListener('click', e => {
      e.stopPropagation();
      if (input.showPicker) { try { input.showPicker(); } catch(err){} }
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
    return chip;
  }

  // ---------- today's list ----------
  let pendingDue = null;
  const addDue = makeDue(null, v => { pendingDue = v; addDue.paint(v, false); });
  $('addDue').replaceWith(addDue);
  addDue.id = 'addDue';

  function render(){
    $('todayDate').textContent = pretty(day);

    const ul = $('list');
    ul.innerHTML = '';
    items.forEach((it, i) => {
      const li = document.createElement('li');
      if (it.done) li.className = 'done';

      const box = document.createElement('span');
      box.className = 'box'; box.innerHTML = TICK;
      box.setAttribute('role', 'checkbox');
      box.setAttribute('tabindex', '0');
      box.setAttribute('aria-checked', it.done ? 'true' : 'false');
      const toggle = () => { items[i].done = !items[i].done; saveToday(); render(); };
      box.addEventListener('click', toggle);
      box.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });

      const txt = document.createElement('span');
      txt.className = 'txt'; txt.textContent = it.text;
      txt.addEventListener('click', toggle);

      const due = makeDue(it.due, v => { items[i].due = v; saveToday(); render(); });
      due.paint(it.due, isLate(it));

      const del = document.createElement('button');
      del.className = 'del'; del.type = 'button'; del.innerHTML = EX;
      del.setAttribute('aria-label', 'Delete');
      del.addEventListener('click', () => { items.splice(i, 1); saveToday(); render(); });

      li.appendChild(box); li.appendChild(txt); li.appendChild(due); li.appendChild(del);
      ul.appendChild(li);
    });

    const done = items.filter(it => it.done).length;
    const late = items.filter(isLate).length;
    $('empty').style.display = items.length ? 'none' : '';

    const count = $('count');
    count.textContent = '';
    if (items.length){
      count.appendChild(document.createTextNode(doneText(done, items.length)));
      if (late){
        count.appendChild(document.createTextNode(' · '));
        const s = document.createElement('span');
        s.className = 'late-n';
        s.textContent = lateText(late);
        count.appendChild(s);
      }
    }
    $('stashBtn').classList.toggle('hide', done === 0);

    const n = archive.length;
    $('archCount').textContent = n;
    $('archCount').classList.toggle('hide', n === 0);
  }

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('addInput').value.trim();
    if (!v) return;
    rollover();                                  // typing just after midnight still lands on the right day
    items.push({ text: v.slice(0, 200), done: false, due: pendingDue });
    $('addInput').value = '';
    pendingDue = null; addDue.paint(null, false);
    saveToday(); render();
    $('addInput').focus();
  });

  $('stashBtn').addEventListener('click', () => {
    const done = items.filter(it => it.done);
    if (!done.length) return;
    items = items.filter(it => !it.done);
    fileInto(day, done);
    saveToday(); render();
    if (!$('overlay').classList.contains('hide')){ openDay = day; renderArchive(); }
  });

  // ---------- archive ----------
  let openDay = null;

  function renderArchive(){
    const body = $('archBody');
    body.innerHTML = '';

    askWipe(false);
    if (!archive.length){
      const p = document.createElement('div');
      p.className = 'arch-empty';
      p.textContent = 'No past days yet. Tick something off and put it away, or leave it on the list overnight, and it lands here.';
      body.appendChild(p);
      $('wipeArch').classList.add('hide');
      return;
    }
    $('wipeArch').classList.remove('hide');
    if (openDay === null) openDay = archive[0].date;

    archive.forEach(entry => {
      const wrap = document.createElement('div');
      wrap.className = 'day' + (entry.date === openDay ? ' open' : '');

      const top = document.createElement('div');
      top.className = 'day-top';

      const caret = document.createElement('span');
      caret.className = 'caret'; caret.innerHTML = CARET;

      const date = document.createElement('span');
      date.className = 'day-date'; date.textContent = pretty(entry.date);

      top.appendChild(caret); top.appendChild(date);

      const gap = daysAgo(entry.date);
      if (gap === 0 || gap === 1){
        const tag = document.createElement('span');
        tag.className = 'tag'; tag.textContent = gap === 0 ? 'Today' : 'Yesterday';
        top.appendChild(tag);
      }

      const done = entry.items.filter(it => it.done).length;
      const cnt = document.createElement('span');
      cnt.className = 'day-count'; cnt.textContent = doneText(done, entry.items.length);
      top.appendChild(cnt);

      const del = document.createElement('button');
      del.className = 'day-del'; del.type = 'button'; del.innerHTML = EX;
      del.setAttribute('aria-label', 'Delete');
      del.addEventListener('click', e => {
        e.stopPropagation();
        archive = archive.filter(x => x.date !== entry.date);
        if (openDay === entry.date) openDay = null;
        saveArchive(); renderArchive(); render();
      });
      top.appendChild(del);

      top.addEventListener('click', () => {
        openDay = (openDay === entry.date) ? '' : entry.date;
        renderArchive();
      });

      const ul = document.createElement('ul');
      ul.className = 'day-items';
      entry.items.forEach(it => {
        const li = document.createElement('li');
        li.className = (it.done ? 'd' : '') + (it.due && !it.done ? ' miss' : '');

        const b = document.createElement('span');
        b.className = 'mini-box'; b.innerHTML = TICK;

        const s = document.createElement('span');
        s.className = 'a-txt'; s.textContent = it.text;

        li.appendChild(b); li.appendChild(s);

        if (it.due){
          const d = document.createElement('span');
          d.className = 'a-due';
          const ic = document.createElement('span'); ic.style.display = 'flex'; ic.innerHTML = CLOCK;
          const lb = document.createElement('span'); lb.textContent = prettyTime(it.due);
          d.appendChild(ic); d.appendChild(lb);
          li.appendChild(d);
        }
        ul.appendChild(li);
      });

      wrap.appendChild(top); wrap.appendChild(ul);
      body.appendChild(wrap);
    });
  }

  function openArchive(){ check(); openDay = null; renderArchive(); $('overlay').classList.remove('hide'); }
  function closeArchive(){ askWipe(false); $('overlay').classList.add('hide'); }

  $('closeArch').innerHTML = EX;
  $('archBtn').addEventListener('click', openArchive);
  $('closeArch').addEventListener('click', closeArchive);
  $('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeArchive(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeArchive(); });
  // Emptying the archive throws away every past day, so it takes two taps.
  function askWipe(on){
    $('wipeArch').classList.toggle('hide', on || !archive.length);
    $('wipeAsk').classList.toggle('hide', !on);
  }
  $('wipeArch').addEventListener('click', () => askWipe(true));
  $('wipeNo').addEventListener('click', () => askWipe(false));
  $('wipeYes').addEventListener('click', () => {
    archive = []; openDay = null; saveArchive(); renderArchive(); render();
  });

  // ---------- keep the day, and the deadlines, honest ----------
  let lateSig = '';
  function check(){
    if (rollover()){
      render();
      if (!$('overlay').classList.contains('hide')){ openDay = null; renderArchive(); }
      return;
    }
    const sig = items.map(isLate).join('');   // a deadline passing is the only other reason to repaint
    if (sig !== lateSig){ lateSig = sig; render(); }
  }
  setInterval(check, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  window.addEventListener('focus', check);
  window.addEventListener('rt-lang', () => {
    addDue.paint(pendingDue, false);
    render();
    if (!$('overlay').classList.contains('hide')) renderArchive();
  });

  rollover();
  render();
  lateSig = items.map(isLate).join('');
</script>
  <script defer src="/cookie-consent.js"></script>
  <script defer src="/lang.js"></script>
  <script defer src="/now-playing.js"></script>
</body>
