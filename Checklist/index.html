<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Checklist — Randomthing.org</title>
<meta name="description" content="A plain checklist. Type a thing, tick it off, and it stays put until you clear it." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --ui:"Inter",system-ui,-apple-system,sans-serif; --ink:#1b1b20; --muted:#8a8a93; --line:#e8e8ec; --accent:#22a06b; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body { font-family:var(--ui); color:var(--ink); background:#f6f7f6; min-height:100vh;
    -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none; }

  .nav { display:flex; align-items:center; gap:12px; padding:14px 20px; padding-left:max(20px, env(safe-area-inset-left)); }
  .brand { font-family:"Baloo 2",sans-serif; font-weight:800; font-size:20px; letter-spacing:-.4px; color:var(--ink); text-decoration:none; padding:5px 8px; border-radius:10px; }
  .brand:hover { background:rgba(0,0,0,.05); }
  .brand .org { color:#ff5a5f; }
  .nav .sep { color:#cfcfd4; } .nav h1 { font-size:15px; font-weight:600; margin:0; color:#56565e; }

  .wrap { max-width:520px; margin:0 auto; padding:6px 18px 70px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:20px; box-shadow:0 12px 30px rgba(30,40,30,.06); overflow:hidden; }

  .add { display:flex; gap:9px; padding:16px; border-bottom:1px solid var(--line); }
  .add input { flex:1 1 auto; min-width:0; border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font:600 15px var(--ui); color:var(--ink); outline:none; -webkit-user-select:text; user-select:text; transition:border-color .12s; }
  .add input:focus { border-color:var(--accent); }
  .add button { flex:0 0 auto; border:none; border-radius:12px; padding:0 18px; cursor:pointer;
    font:800 15px "Baloo 2",var(--ui); background:var(--accent); color:#fff; transition:filter .14s, transform .06s; }
  .add button:hover { filter:brightness(1.07); } .add button:active { transform:translateY(1px); }

  ul.list { list-style:none; margin:0; padding:0; }
  ul.list li { display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid #f1f1f3; }
  ul.list li:last-child { border-bottom:none; }
  .box { flex:0 0 auto; width:22px; height:22px; border-radius:7px; border:2px solid #d6d6dc; background:#fff;
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color .12s, background .12s; }
  .box:hover { border-color:var(--accent); }
  .box svg { width:13px; height:13px; opacity:0; transform:scale(.6); transition:opacity .12s, transform .12s; color:#fff; }
  li.done .box { background:var(--accent); border-color:var(--accent); }
  li.done .box svg { opacity:1; transform:scale(1); }
  .txt { flex:1 1 auto; min-width:0; font-size:15px; font-weight:500; line-height:1.4; word-break:break-word;
    cursor:pointer; transition:color .12s; }
  li.done .txt { color:#b3b3bb; text-decoration:line-through; }
  .del { flex:0 0 auto; border:none; background:none; cursor:pointer; color:#c9c9d0; padding:5px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .12s, color .12s, background .12s; }
  .del svg { width:15px; height:15px; }
  li:hover .del, li:focus-within .del { opacity:1; }
  .del:hover { color:#e5484d; background:rgba(229,72,77,.1); }

  .empty { padding:34px 20px; text-align:center; color:var(--muted); font-size:14px; font-weight:500; }

  .foot { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 16px;
    border-top:1px solid var(--line); background:#fbfbfb; }
  .count { font-size:13px; font-weight:600; color:var(--muted); }
  .clear { border:none; background:none; cursor:pointer; font:600 13px var(--ui); color:var(--muted);
    padding:6px 10px; border-radius:9px; transition:color .12s, background .12s; }
  .clear:hover { color:#e5484d; background:rgba(229,72,77,.08); }
  .clear.hide { display:none; }

  @media (max-width:380px){ .add { padding:13px; } ul.list li { padding:12px 13px; } .del { opacity:1; } }
</style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">Randomthing<span class="org">.org</span></a>
    <span class="sep">/</span><h1>Checklist</h1>
  </nav>

  <div class="wrap">
    <div class="card">
      <form class="add" id="addForm" autocomplete="off">
        <input id="addInput" type="text" maxlength="200" placeholder="Add an item…" aria-label="Add an item" />
        <button type="submit" id="addBtn">Add</button>
      </form>

      <ul class="list" id="list"></ul>
      <div class="empty" id="empty">Nothing here yet — add your first item above.</div>

      <div class="foot">
        <span class="count" id="count"></span>
        <button class="clear hide" id="clearBtn" type="button">Clear done</button>
      </div>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const KEY = 'checklist_items';
  const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  const BIN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  let items = load();

  function load(){
    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      if (!Array.isArray(raw)) return [];
      return raw.filter(o => o && typeof o.text === 'string')
                .map(o => ({ text: o.text.slice(0, 200), done: !!o.done }));
    } catch(e){ return []; }
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){} }

  function render(){
    const ul = $('list');
    ul.innerHTML = '';
    items.forEach((it, i) => {
      const li = document.createElement('li');
      if (it.done) li.className = 'done';

      const box = document.createElement('span');
      box.className = 'box'; box.innerHTML = TICK;
      box.setAttribute('role', 'checkbox');
      box.setAttribute('tabindex', '0');
      box.setAttribute('aria-checked', it.done ? 'true' : 'false');
      const toggle = () => { items[i].done = !items[i].done; save(); render(); };
      box.addEventListener('click', toggle);
      box.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });

      const txt = document.createElement('span');
      txt.className = 'txt'; txt.textContent = it.text;
      txt.addEventListener('click', toggle);

      const del = document.createElement('button');
      del.className = 'del'; del.type = 'button'; del.innerHTML = BIN;
      del.setAttribute('aria-label', 'Delete');
      del.addEventListener('click', () => { items.splice(i, 1); save(); render(); });

      li.appendChild(box); li.appendChild(txt); li.appendChild(del);
      ul.appendChild(li);
    });

    const done = items.filter(it => it.done).length;
    $('empty').style.display = items.length ? 'none' : '';
    $('count').textContent = items.length ? (done + ' of ' + items.length + ' done') : '';
    $('clearBtn').classList.toggle('hide', done === 0);
  }

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('addInput').value.trim();
    if (!v) return;
    items.push({ text: v.slice(0, 200), done: false });
    $('addInput').value = '';
    save(); render();
    $('addInput').focus();
  });

  $('clearBtn').addEventListener('click', () => {
    items = items.filter(it => !it.done);
    save(); render();
  });

  render();
</script>
  <script defer src="/cookie-consent.js"></script>
  <script defer src="/lang.js"></script>
  <script defer src="/now-playing.js"></script>
</body>
</html>
